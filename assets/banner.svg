<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Murat Özçelik — m. | Systems · Linux · Creative Tooling">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3FB950" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#161B22" stop-opacity="0" />
    </linearGradient>
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="258" rx="12" ry="12" />
    </clipPath>
  </defs>

